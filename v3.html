<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&lt;3 | Liar Entertainment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-v3">
    <header class="header">
        <a href="index.html" class="logo-area">Liar Entertainment</a>
        <div class="menu-btn" id="menu-btn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>
    <nav class="nav-overlay" id="nav-menu">
        <ul>
            <li><a href="index.html" onclick="toggleMenu()">ARTISTS</a></li>
        </ul>
    </nav>

    <div class="modal" id="master-modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal(null, true)">×</span>
            <h3 id="modal-title" style="font-family:'Montserrat'; font-weight:800; font-size:2rem; margin-bottom:15px; text-transform:uppercase;"></h3>
            <div id="modal-body"></div>
        </div>
    </div>

    <main>
        <div class="hero-header">
            <a href="index.html" class="back-link">← ALL ARTISTS</a>
            <h1 class="artist-main-title">&lt;3</h1>
        </div>

        <div class="tab-container">
            <button onclick="switchTab('profile')" id="btn-profile" class="tab-btn active">Profile</button>
            <button onclick="switchTab('disco')" id="btn-disco" class="tab-btn">Discography</button>
        </div>

        <div id="profile" class="content-section active">
            <section>
                <div class="about-box">
                    <img src="images/v3/v3-main.jpg">
                    <div>
                        <h3>ABOUT &lt;3</h3>
                        <p>&lt;3（V3、ヴィスリ）は、韓国の3人組バーチャルアイドルグループ。Liar Entertainment所属。グループ名は「ViVid Venom」の略称であり“鮮やかな音楽の毒で世界を魅了する”という意味を持つ。Vが横向き（&lt;）になっているのは英語のスラングである「横向きハートマーク」を表している。</p>
                    </div>
                </div>
                <div id="member-grid" class="info-grid"></div>
            </section>
        </div>

        <div id="disco" class="content-section">
            <section>
                <div id="disco-grid" class="info-grid"></div>
            </section>
        </div>
    </main>

    <footer class="common-footer">
        <a href="index.html" class="f-logo">Liar Entertainment</a>
        <p class="f-copy">&copy; Liar Entertainment Corp. All Rights Reserved.</p>
    </footer>

    <script src="data.js"></script>
    <script>
        const mBox = document.getElementById('member-grid');
        V3_DATA.members.forEach((m, i) => {
            mBox.innerHTML += `<div class="card" onclick="openMemberModal('v3', ${i})"><img src="${m.img}"><p class="card-name">${m.name.split(' ')[0]}</p></div>`;
        });
        const dBox = document.getElementById('disco-grid');
        V3_DATA.albums.forEach((a, i) => {
            dBox.innerHTML += `<div class="card" onclick="openAlbumModal('v3', ${i})"><img src="${a.img}"><p class="card-name">${a.title}</p></div>`;
        });
    </script>
</body>
</html>
