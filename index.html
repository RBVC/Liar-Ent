<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liar Entertainment | Official</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-index">
    <header>
        <a href="index.html" class="logo">Liar Entertainment</a>
        <div class="menu-trigger" id="menu-btn" onclick="toggleMenu()"><span></span><span></span><span></span></div>
    </header>

    <nav class="nav-overlay" id="nav-menu">
        <span class="nav-label">ARTIST LIST</span>
        <ul><!-- JSで自動生成 --></ul>

    <main>
        <section id="index-artists" class="index-grid"><!-- JSで自動生成 --></section>

    <footer>
        <a href="index.html" class="f-logo-link"><div class="f-logo">Liar Entertainment</div></a>

    </footer>

    <script src="data.js"></script>
    <script>
        // トップページのグリッド生成
        const grid = document.getElementById('index-artists');
        grid.innerHTML = Object.keys(allGroups).map(id => `
            <a href="artist.html?id=${id}" class="index-artist-box">
                <img src="${allGroups[id].banner}" alt="${allGroups[id].name}">
                <div class="index-artist-hover"><span class="index-hover-name">${allGroups[id].name}</span></div>
            </a>
        `).join('');
    </script>
