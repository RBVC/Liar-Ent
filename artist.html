<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist | Liar Entertainment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Liar Entertainment</a>
        <div class="menu-trigger" id="menu-btn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>

    <div class="nav-overlay" id="nav-menu">
        <a href="index.html" class="logo-font">ARTISTS</a>
    </div>

    <div class="modal" id="master-modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal(null, true)">×</span>
            <h3 id="modal-title" class="logo-font" style="font-size:2rem; margin-bottom:20px;"></h3>
            <div id="modal-body"></div>
        </div>
    </div>

    <main style="max-width:1200px; margin:0 auto; padding:120px 20px;">
        <div class="text-center" style="text-align:center; margin-bottom:60px;">
            <a href="index.html" style="font-size:10px; color:#ccc; text-decoration:none; font-weight:800; letter-spacing:4px;">← ALL ARTISTS</a>
            <h1 id="group-name" class="artist-main-title">Artist</h1>
        </div>

        <div class="tab-container">
            <button onclick="switchTab('profile')" id="btn-profile" class="tab-btn active">Profile</button>
            <button onclick="switchTab('disco')" id="btn-disco" class="tab-btn">Discography</button>
        </div>

        <!-- PROFILE -->
        <div id="profile" class="content-section block">
            <div class="about-box">
                <img id="group-banner" src="">
                <div>
                    <h3 class="logo-font" id="about-title">ABOUT</h3>
                    <p id="group-about"></p>
                </div>
            </div>
            <h2 class="logo-font" style="font-size:2rem; margin-bottom:30px; border-left:8px solid #000; padding-left:20px;">MEMBER</h2>
            <div id="member-grid" class="member-flex-container"></div>
        </div>

        <!-- DISCOGRAPHY -->
        <div id="disco" class="content-section">
            <h2 class="logo-font" style="font-size:2rem; margin-bottom:30px; border-left:8px solid #000; padding-left:20px;">DISCOGRAPHY</h2>
            <div id="disco-grid" class="disco-grid-container"></div>
        </div>
    </main>

    <footer class="common-footer">
        <div class="f-logo">Liar Entertainment</div>
        <p class="f-copy">&copy; Liar Entertainment All Rights Reserved.</p>
    </footer>

    <script src="data.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const groupId = params.get('id') || 'v3';
        const data = allGroups[groupId];

        if (data) {
            document.title = `${data.name} | Liar Entertainment`;
            document.getElementById('group-name').innerText = data.name;
            document.getElementById('group-banner').src = data.banner;
            document.getElementById('group-about').innerHTML = data.about;
            document.getElementById('about-title').innerText = `ABOUT ${data.name}`;

            // メンバー描画
            const mGrid = document.getElementById('member-grid');
            data.members.forEach((m, i) => {
                const content = `<img src="${m.img}" class="modal-img"><div class="modal-info-list"><div class="modal-info-item"><span class="modal-label">BIRTHDAY</span><span class="modal-value">${m.birthday}</span></div><div class="modal-info-item"><span class="modal-label">POSITION</span><span class="modal-value">${m.pos}</span></div></div>`;
                mGrid.innerHTML += `
                    <div class="member-card" onclick="openModal('${m.name}', '${content.replace(/'/g, "\\'")}')">
                        <div class="img-wrap"><img src="${m.img}"></div>
                        <p class="logo-font" style="margin-top:10px; font-size:1.2rem;">${m.name.split(' ')[0]}</p>
                    </div>`;
            });

            // ディスコ描画
            const dGrid = document.getElementById('disco-grid');
            data.discography.forEach((d, i) => {
                const content = `<p style="font-size:12px; color:#ccc; margin-bottom:20px; font-weight:800;">${d.type}</p><div>${d.embed}</div>`;
                dGrid.innerHTML += `
                    <div class="disco-card" onclick="openModal('${d.title}', '${content.replace(/'/g, "\\'")}')">
                        <div class="img-wrap"><img src="${d.img}"></div>
                        <p class="logo-font" style="margin-top:10px; font-size:1.2rem;">${d.title}</p>
                    </div>`;
            });
        }
    </script>
</body>
</html>
