<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GØD7IKE | Liar Entertainment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-god">
    <div class="menu-closer" id="menu-closer" onclick="toggleMenu()"></div>

    <header class="header">
        <a href="god7ike.html" class="logo-area">GØD7IKE</a>
        <div class="menu-btn" id="menu-btn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>

    <nav class="nav-overlay" id="nav-overlay">
        <ul>
            <li><a href="#news" onclick="toggleMenu()">NEWS</a></li>
            <li><a href="#profile" onclick="toggleMenu()">PROFILE</a></li>
            <li><a href="#discography" onclick="toggleMenu()">DISCOGRAPHY</a></li>
        </ul>
    </nav>

    <!-- 共通モーダル -->
    <div class="modal" id="master-modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal(null, true)">×</span>
            <h3 id="modal-title" class="v3-main-font" style="font-size:2.8rem; margin-bottom:10px;"></h3>
            <div id="modal-body"></div>
        </div>
    </div>

    <main>
        <!-- 1. NEW RELEASE -->
        <section class="new-release-flex">
            <a href="#OOMM"><img src="https://placehold.jp/320x320.png?text=OOMM" class="v3-img-std"></a>
            <div class="new-release-info">
                <span class="v3-tag">LATEST RELEASE</span>
                <h1 class="v3-main-font">OOMM</h1>
                <p style="font-size:1.1rem; color:#ccc; font-family:'Noto Sans JP';">1st Mini Album / 2023.05.21</p>
            </div>
        </section>

        <!-- 2. NEWS -->
        <section id="news">
            <h2 class="v3-sub-heading">NEWS</h2>
            <div id="news-list" style="border-top: 1px solid #ffffff;"></div>
        </section>

        <!-- 3. PROFILE -->
        <section id="profile">
            <h2 class="v3-sub-heading">PROFILE</h2>
            <div class="group-intro">
                <img src="https://placehold.jp/320x320.png?text=GROUP+IMAGE" class="v3-img-std">
                <div>
                    <h3 class="v3-sub-heading" style="font-size: 2.2rem; border:none; margin-bottom: 10px;">ABOUT GØD7IKE</h3>
                    <p style="font-family: 'Noto Sans JP';">
                        GODLIKE（ゴッドライク）は、韓国の7人組バーチャルアイドルグループ。Liar Entertainment所属。グループ名には“神のような人間離れしたパフォーマンスで世界を魅了する”という意味が込められている。
                    </p>
                </div>
            </div>
            
            <div id="member-grid" class="member-grid"></div>
        </section>

        <!-- 4. DISCOGRAPHY -->
        <section id="discography">
            <h2 class="v3-sub-heading">DISCOGRAPHY</h2>
            <div id="disco-grid" class="disco-grid"></div>
        </section>
    </main>

    <footer class="common-footer">
        <a href="index.html" class="f-logo">Liar Entertainment</a>
        <p class="f-copy">© Liar Entertainment Corp.</p>
    </footer>

    <script src="data.js"></script>
    <script>
        // ニュース生成
        const newsBox = document.getElementById('news-list');
        GOD_NEWS.forEach(n => {
            newsBox.innerHTML += `<a href="${n.link}" class="news-item"><div class="news-meta"><span class="news-date">${n.date}</span><span class="v3-tag">${n.tag}</span></div><span class="news-title">${n.title}</span></a>`;
        });
        // メンバー生成
        const memberBox = document.getElementById('member-grid');
        GOD_MEMBERS.forEach((m, i) => {
            memberBox.innerHTML += `<div class="member-card" onclick="openMemberModal(GOD_MEMBERS, ${i})"><img src="${m.img}" class="v3-img-std"><p class="member-name-top">${m.name.split(' ')[0]}</p></div>`;
        });
        // ディスコ生成
        const discoBox = document.getElementById('disco-grid');
        GOD_ALBUMS.forEach((a, i) => {
            discoBox.innerHTML += `<img src="${a.img}" id="${a.id}" class="disco-thumb v3-img-std" onclick="openAlbumModal(GOD_ALBUMS, ${i})">`;
        });
    </script>
</body>
</html>
