<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMBED TEST | &lt;3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-v3">
    <div class="menu-closer" id="menu-closer" onclick="toggleMenu()"></div>
    <header class="header">
        <a href="v3.html" class="logo-area">TEST MODE</a>
        <div class="menu-btn" id="menu-btn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>
    <div class="modal" id="master-modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal(null, true)">×</span>
            <h3 id="modal-title" class="v3-main-font" style="font-size:2.8rem; margin-bottom:10px;"></h3>
            <div id="modal-body"></div>
        </div>
    </div>
    <main>
        <section>
            <h2 class="v3-sub-heading">EMBED EXPERIMENT</h2>
            <p style="margin-bottom:30px;">ポップアップ内の埋め込みが成功するかテストします。</p>
            <div id="disco-grid" class="disco-grid"></div>
        </section>
    </main>
    <footer class="common-footer">
        <a href="v3.html" class="f-logo">EXIT TEST</a>
    </footer>
    <script src="data.js"></script>
    <script>
        const discoBox = document.getElementById('disco-grid');
        V3_ALBUMS.forEach((a, i) => {
            // ここだけ openTestModal を呼ぶように設定
            discoBox.innerHTML += `<img src="${a.img}" class="disco-thumb v3-img-std" onclick="openTestModal(${i})">`;
        });
    </script>
</body>
</html>
