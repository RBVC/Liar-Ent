<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist | Liar Entertainment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Liar Entertainment</a>
        <div class="menu-trigger" id="menu-btn" onclick="toggleMenu()"><span></span><span></span><span></span></div>
    </header>

    <nav class="nav-overlay" id="nav-menu">
        <span class="nav-label">ARTIST LIST</span>
        <ul></ul>
    </nav>

    <main>
        <div class="hero-header">
            <a href="index.html" class="back-link">← ALL ARTISTS</a>
            <h1 id="group-name" class="artist-main-title">Artist</h1>
        </div>

        <div class="tab-container">
            <button onclick="switchTab('profile')" id="btn-profile" class="tab-btn active">Profile</button>
            <button onclick="switchTab('news')" id="btn-news" class="tab-btn">News</button>
            <button onclick="switchTab('disco')" id="btn-disco" class="tab-btn">Discography</button>
        </div>

        <div id="profile" class="content-section active">
            <div class="about-box">
                <img id="group-banner" src="">
                <div><h3>ABOUT</h3><p id="group-about"></p></div>
            </div>
            <div id="member-section-container">
                <h2 class="section-title">MEMBER</h2>
                <div id="member-grid" class="info-grid"></div>
            </div>
        </div>

        <div id="news" class="content-section">
            <h2 class="section-title">NEWS</h2>
            <div id="news-list-container" class="news-list"></div>
        </div>

        <div id="disco" class="content-section">
            <h2 class="section-title">DISCOGRAPHY</h2>
            <div id="disco-grid" class="info-grid"></div>
        </div>
    </main>

    <footer></footer>

    <script src="common.js"></script>
    <script src="data/god7ike.js"></script>
    <script src="data/lcr.js"></script>
    <script src="data/hayul.js"></script>
    <script src="data/v3.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const groupId = params.get('id') || 'god7ike';
        const data = allGroups[groupId];

        if (data) {
            document.title = `${data.name} | Liar Entertainment`;
            document.getElementById('group-name').innerText = data.name;
            document.getElementById('group-banner').src = data.banner;
            document.getElementById('group-about').innerHTML = data.about.split('。').join('。<br>');

            if (!data.hasMemberSection) document.getElementById('member-section-container').style.display = 'none';

            // MEMBER
            document.getElementById('member-grid').innerHTML = (data.members || []).map((m, i) => `
                <div class="card ${data.clickableMembers ? '' : 'no-click'}" ${data.clickableMembers ? `onclick="openMemberModal('${groupId}', ${i})"` : ''}>
                    <div class="img-wrap"><img src="${m.img}"></div>
                    <p class="card-name">${m.name.split(' ')[0]}</p>
                </div>`).join('');

            // DISCOGRAPHY
            document.getElementById('disco-grid').innerHTML = data.discography.map((d, i) => `
                <div class="card" onclick="openAlbumModal('${groupId}', ${i})">
                    <div class="img-wrap"><img src="${d.img}"></div>
                    <p class="card-name">${d.title}</p>
                </div>`).join('');

            // NEWS (全件表示)
            const nContainer = document.getElementById('news-list-container');
            const newsData = data.news || [];
            if (newsData.length === 0) {
                nContainer.innerHTML = '<p style="text-align:center; padding:40px; color:#ccc; font-weight:900;">NO NEWS AVAILABLE</p>';
            } else {
                nContainer.innerHTML = newsData.map(n => `
                    <div class="news-item">
                        <span class="news-date">${n.date}</span>
                        <span class="news-title">${n.title}</span>
                    </div>`).join('');
            }
        }
    </script>
</body>
</html>
