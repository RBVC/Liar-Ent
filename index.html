<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTIST | Liar Entertainment</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-index">
    <!-- メニュー外をタップした時に閉じるための透明カバー -->
    <div class="menu-closer" id="menu-closer" onclick="toggleMenu()"></div>

    <header class="header">
        <a href="index.html" class="logo-area">Liar Entertainment</a>
        <!-- ハンバーガーメニューボタン -->
        <div class="menu-btn" id="menu-btn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>

    <nav class="nav-overlay" id="nav-overlay">
        <ul>
            <li><a href="index.html" onclick="toggleMenu()">ARTIST</a></li>
            <li><a href="#" onclick="toggleMenu()">NEWS</a></li>
        </ul>
    </nav>

    <main>
        <!-- タイトルエリア -->
        <h1 style="text-align:center; padding:80px 0; font-size:3.5rem; letter-spacing:10px; font-weight:800; font-family:'Montserrat';">ARTIST</h1>
        
        <!-- アーティスト一覧 -->
        <div class="artist-grid">
            <!-- <3 カード (v3フォルダへリンク) -->
            <a href="v3/" class="artist-card">
                <div class="img-placeholder">
                    <img src="v3/images/v3-main.jpg" alt="<3">
                </div>
                <h2 class="artist-v3-font">&lt;3</h2>
            </a>

            <!-- GØD7IKE カード (god7ikeフォルダへリンク) -->
            <a href="god7ike/" class="artist-card">
                <div class="img-placeholder">
                    <div style="padding:40% 0; text-align:center; color:#ccc; font-family:'Montserrat'; font-weight:bold;">COMING SOON</div>
                </div>
                <h2 class="artist-god-font">GØD7IKE</h2>
            </a>
        </div>
    </main>

    <footer class="common-footer">
        <a href="index.html" class="f-logo">Liar Entertainment</a>
        <p class="f-copy">© Liar Entertainment Corp.</p>
    </footer>

    <script>
        function toggleMenu() {
            // 三本線を「×」に変形
            document.getElementById('menu-btn').classList.toggle('open');
            // メニューを右からスライド
            document.getElementById('nav-overlay').classList.toggle('open');
            // 背景の薄暗いカバーを表示
            document.getElementById('menu-closer').classList.toggle('open');
        }
    </script>
</body>
</html>
