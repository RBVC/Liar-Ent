<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist | Liar Entertainment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Liar Entertainment</a>
        <div class="menu-trigger" id="menu-btn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </header>

    <nav class="nav-overlay" id="nav-menu">
        <span style="font-size:10px; color:#ccc; letter-spacing:5px; font-weight:900; margin-bottom:10px; display:block;">ARTIST LIST</span>
        <ul>
            <li><a href="artist.html?id=v3" onclick="toggleMenu()">&lt;3</a></li>
            <li><a href="artist.html?id=god7ike" onclick="toggleMenu()">GØD7IKE</a></li>
            <li><a href="artist.html?id=lcr" onclick="toggleMenu()">LCR</a></li>
            <li><a href="artist.html?id=hayul" onclick="toggleMenu()">HAYUL</a></li>
        </ul>
    </nav>

    <div class="modal" id="master-modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal(null, true)">×</span>
            <h3 id="modal-title" style="font-weight:900; font-size:1.6rem; margin-bottom:15px; text-transform:uppercase;"></h3>
            <div id="modal-body"></div>
        </div>
    </div>

    <main>
        <div class="hero-header">
            <a href="index.html" style="font-size:10px; color:#ccc; text-decoration:none; font-weight:900; letter-spacing:2px;">← ALL ARTISTS</a>
            <h1 id="group-name" class="artist-main-title">Artist</h1>
        </div>

        <div class="tab-container">
            <button onclick="switchTab('profile')" id="btn-profile" class="tab-btn active">Profile</button>
            <button onclick="switchTab('disco')" id="btn-disco" class="tab-btn">Discography</button>
        </div>

        <div id="profile" class="content-section active">
            <div class="about-box">
                <img id="group-banner" src="">
                <div>
                    <h3 style="font-weight:900;">ABOUT</h3>
                    <p id="group-about" style="color:#666;"></p>
                </div>
            </div>
            
            <div id="member-section-container">
                <h2 style="font-weight:900; font-size:1.5rem; margin-bottom:30px; border-left:8px solid #000; padding-left:20px;">MEMBER</h2>
                <div id="member-grid" class="info-grid"></div>
            </div>
        </div>

        <div id="disco" class="content-section">
            <h2 style="font-weight:900; font-size:1.5rem; margin-bottom:30px; border-left:8px solid #000; padding-left:20px;">DISCOGRAPHY</h2>
            <div id="disco-grid" class="info-grid"></div>
        </div>
    </main>

    <footer>
        <a href="index.html" class="f-logo-link"><div class="f-logo">Liar Entertainment</div></a>
        <p class="f-copy">&copy; Liar Entertainment Corp. All Rights Reserved.</p>
    </footer>

    <script src="data.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const groupId = params.get('id') || 'v3';
        const data = allGroups[groupId];

        if (data) {
            document.title = `${data.name} | Liar Entertainment`;
            document.getElementById('group-name').innerText = data.name;
            document.getElementById('group-banner').src = data.banner;
            const aboutText = data.about.split('。').join('。<br>');
            document.getElementById('group-about').innerHTML = aboutText;

            if (data.hasMemberSection === false) {
                document.getElementById('member-section-container').style.display = 'none';
            }

            const mGrid = document.getElementById('member-grid');
            data.members.forEach((m, i) => {
                const clickAttr = data.clickableMembers ? `onclick="openMemberModal('${groupId}', ${i})"` : '';
                const noClickClass = data.clickableMembers ? '' : 'no-click';
                mGrid.innerHTML += `
                    <div class="card ${noClickClass}" ${clickAttr}>
                        <div class="img-wrap"><img src="${m.img}"></div>
                        <p class="card-name">${m.name.split(' ')[0]}</p>
                    </div>`;
            });

            const dGrid = document.getElementById('disco-grid');
            data.discography.forEach((d, i) => {
                dGrid.innerHTML += `
                    <div class="card" onclick="openAlbumModal('${groupId}', ${i})">
                        <div class="img-wrap"><img src="${d.img}"></div>
                        <p class="card-name">${d.title}</p>
                    </div>`;
            });
        }
    </script>
</body>
</html>
